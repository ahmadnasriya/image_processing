<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Image</title>
    <script src="/assets/global/themesManager.js" type="module"></script>
    <link rel="stylesheet" href="/assets/global/global.css">
    <link rel="stylesheet" href="/assets/pages/editor/style.css">
    <script src="/assets/pages/editor/index.js" type="module"></script>
</head>

<body>
    <header class="editor-header">
        <h1>Edit Your Image</h1>
        <p>Want to edit another one? <a href="/">Upload a new image</a></p>
    </header>
    <div id="widget" class="card">
        <div class="img-container">
            <img id="preview" src="#" alt="Uploaded Image">

            <div class="actions">
                <button id="downloadBtn">Download</button>
                <div class="copy-clipboard">
                    <input type="url" id="imageUrlInput" readonly>
                    <button id="copyBtn">Copy URL</button>
                </div>
            </div>
        </div>

        <div class="controls">
            <div aria-label="Dimensions" id="dimensions" class="control-config">
                <h3>Dimensions</h3>
                <div class="control-content">
                    <div id="widthContainer">
                        <label for="width">Width</label>
                        <input id="width" type="number" min="1"></label>
                    </div>
                    <div id="heightContainer">
                        <label for="height">Height</label>
                        <input id="height" type="number" min="1"></label>
                    </div>
                </div>
            </div>

            <div aria-label="Quality" class="control-config" id="quality">
                <h3>Quality</h3>
                <div class="control-content">
                    <input type="number" id="qualityNumber" min="1" max="100" value="100" step="1">
                    <div class="range-container">
                        <input type="range" id="qualitySlider" name="quality" min="1" max="100" value="100" step="1">
                    </div>
                </div>
            </div>

            <div aria-label="Symmetry & Rotation" id="symmetry" class="control-config">
                <h3>Symmetry & Rotation</h3>
                <div class="control-content">
                    <div id="mirror" class="iconSet">
                        <button id="flipH" class="iconBtn" aria-label="Flip Horizontal">
                            <svg xmlns="http://www.w3.org/2000/svg" version="1.1"
                                xmlns:xlink="http://www.w3.org/1999/xlink" width="512" height="512" x="0" y="0"
                                viewBox="0 0 22 22" style="enable-background:new 0 0 512 512" xml:space="preserve"
                                class="">
                                <g
                                    transform="matrix(-1.8369701987210297e-16,-1,-1,1.8369701987210297e-16,22.000000000000004,21.999999999999996)">
                                    <path fill-rule="evenodd"
                                        d="M3 12v10l16-10zm16-3L3 0v9zm2 1H1v1h20zM3.992 12.998V20.2l11.525-7.203z"
                                        opacity="1" data-original="#000000" class=""></path>
                                </g>
                            </svg>
                            <span class="tooltip">Flip Horizontaly</span>
                        </button>

                        <button id="flipV" class="iconBtn" aria-label="Flip Vertical">
                            <svg xmlns="http://www.w3.org/2000/svg" version="1.1"
                                xmlns:xlink="http://www.w3.org/1999/xlink" width="512" height="512" x="0" y="0"
                                viewBox="0 0 22 22" style="enable-background:new 0 0 512 512" xml:space="preserve"
                                class="">
                                <g
                                    transform="matrix(1,-2.4492935982947064e-16,-2.4492935982947064e-16,-1,3.552713678800501e-15,22.000000000000004)">
                                    <path fill-rule="evenodd"
                                        d="M3 12v10l16-10zm16-3L3 0v9zm2 1H1v1h20zM3.992 12.998V20.2l11.525-7.203z"
                                        opacity="1" data-original="#000000" class=""></path>
                                </g>
                            </svg>
                            <span class="tooltip">Flip Verticaly</span>
                        </button>
                    </div>

                    <div id="rotate" class="iconSet">
                        <button id="rotateL" class="iconBtn" aria-label="Rotate 90º left">
                            <svg xmlns="http://www.w3.org/2000/svg" version="1.1"
                                xmlns:xlink="http://www.w3.org/1999/xlink" width="512" height="512" x="0" y="0"
                                viewBox="0 0 24 24" style="enable-background:new 0 0 512 512" xml:space="preserve"
                                class="">
                                <g transform="matrix(-1,0,0,1,24.003934383392334,0)">
                                    <path
                                        d="M19.602 12.635a.99.99 0 0 0-1.134.844 6.402 6.402 0 0 1-1.83 3.618 6.506 6.506 0 0 1-9.192 0 6.507 6.507 0 0 1 0-9.192 6.414 6.414 0 0 1 3.503-1.8 6.187 6.187 0 0 1 1.848-.055 6.414 6.414 0 0 1 2.466.828l-1.302.223a1 1 0 1 0 .338 1.971l3.49-.596a1.002 1.002 0 0 0 .816-1.155l-.597-3.49a1 1 0 1 0-1.97.338l.156.919a8.423 8.423 0 0 0-3.17-1.025 8.102 8.102 0 0 0-2.428.074 8.379 8.379 0 0 0-4.564 2.354c-3.313 3.314-3.313 8.705 0 12.02a8.471 8.471 0 0 0 6.01 2.485 8.471 8.471 0 0 0 6.01-2.485 8.39 8.39 0 0 0 2.394-4.741 1 1 0 0 0-.843-1.135z"
                                        opacity="1" data-original="#000000" class=""></path>
                                </g>
                            </svg>
                            <span class="tooltip">Rotate 90º Left</span>
                        </button>

                        <button id="rotateR" class="iconBtn" aria-label="Rotate 90º Right">
                            <svg xmlns="http://www.w3.org/2000/svg" version="1.1"
                                xmlns:xlink="http://www.w3.org/1999/xlink" width="512" height="512" x="0" y="0"
                                viewBox="0 0 24 24" style="enable-background:new 0 0 512 512" xml:space="preserve"
                                class="">
                                <g>
                                    <path
                                        d="M19.602 12.635a.99.99 0 0 0-1.134.844 6.402 6.402 0 0 1-1.83 3.618 6.506 6.506 0 0 1-9.192 0 6.507 6.507 0 0 1 0-9.192 6.414 6.414 0 0 1 3.503-1.8 6.187 6.187 0 0 1 1.848-.055 6.414 6.414 0 0 1 2.466.828l-1.302.223a1 1 0 1 0 .338 1.971l3.49-.596a1.002 1.002 0 0 0 .816-1.155l-.597-3.49a1 1 0 1 0-1.97.338l.156.919a8.423 8.423 0 0 0-3.17-1.025 8.102 8.102 0 0 0-2.428.074 8.379 8.379 0 0 0-4.564 2.354c-3.313 3.314-3.313 8.705 0 12.02a8.471 8.471 0 0 0 6.01 2.485 8.471 8.471 0 0 0 6.01-2.485 8.39 8.39 0 0 0 2.394-4.741 1 1 0 0 0-.843-1.135z"
                                        opacity="1" data-original="#000000" class=""></path>
                                </g>
                            </svg>
                            <span class="tooltip">Rotate 90º Right</span>
                        </button>
                    </div>
                </div>
            </div>

            <button id="resetBtn" class="secondary" disabled>Reset Image</button>
        </div>

    </div>
</body>

</html>
