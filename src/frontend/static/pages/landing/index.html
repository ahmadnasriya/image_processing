<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Processing App</title>
    <script src="/assets/global/themesManager.js" type="module"></script>
    <link rel="stylesheet" href="/assets/global/global.css">
    <link rel="stylesheet" href="/assets/pages/landing/style.css">
    <script src="/assets/pages/landing/index.js" defer></script>
</head>

<body>
    <header class="page-header">
        <h1>👋 Welcome!</h1>
        <div class="theme-selector">
            <label for="themeSelector">Theme:</label>
            <select id="themeSelector">
                <option value="auto">Auto</option>
                <option value="minimal">Minimal</option>
                <option value="dark">Dark</option>
                <option value="fresh">Fresh</option>
                <option value="warm">Warm</option>
            </select>
        </div>
    </header>

    <main class="page-main">
        <p>Start by uploading a picture</p>
        <label class="drop-zone" id="dropZone">
            <p>Click to choose a file or drag it here</p>
            <input type="file" id="fileInput" accept="image/png, image/jpeg, image/jpg">
        </label>
    </main>
</body>

</html>
